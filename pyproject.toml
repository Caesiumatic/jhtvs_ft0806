[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jhtvs-ft0806"
version = "0.1.0"
description = "Solvent-conditioned Tier-2 property surrogate workflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Caesiumatic" }]
dependencies = ["rdkit==2026.3.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
ml = [
  "ase>=3.22",
  "mace-torch==0.3.16",
  "torch>=2.2,!=2.4.1",
  "graph_longrange @ git+https://github.com/WillBaldwin0/graph_electrostatics.git@v0.4.0",
]

[project.scripts]
jhtvs-ft0806 = "jhtvs_ft0806.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
